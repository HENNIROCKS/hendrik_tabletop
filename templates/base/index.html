<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Base</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<!-- render.mjs fills every [data-field]; the sample content shows when the file is opened as it is. -->
	<main class="post">
		<header class="post-head">
			<p class="post-date">
				<time data-field="date">Nov 4, 2026</time>
				<span class="post-page" data-field="page">· 1/2</span>
			</p>
			<h1 class="post-title" data-field="title">How to: Install</h1>
		</header>
		<div class="post-qr" data-field="qr" data-url="https://hennirocks.github.io/fantasy-city-warbands"></div>
		<div class="post-text" data-field="text">
			<p>Lorem ipsum dolor sit amet consectetuer adipiscing. Elit aenean commodo ligula eget dolor. Aenean massa.</p>
		</div>
		<div class="post-graphic" data-field="graphic"></div>
	</main>
</body>
</html>
